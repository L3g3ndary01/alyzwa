<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Yzwa Grilling Fish | اليزوه لشوي الأسماك</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Header & Mobile Nav -->
    <header class="header">
        <div class="logo">
            <img src="logo.png" alt="Al Yzwa Logo" class="logo-img">
            <div class="logo-text">
                <h1>AL YZWA</h1>
                <p>GRILLING FISH</p>
            </div>
        </div>
        <nav class="nav-menu">
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        <div class="hamburger">
            <i class="fas fa-bars"></i>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h2>Fresh Catch, Grilled to Perfection</h2>
            <p>اليزوه لشوي الأسماك</p>
            <div class="hero-buttons">
                <a href="#menu" class="btn primary-btn">View Menu</a>
                <a href="tel:+97451034445" class="btn secondary-btn"><i class="fas fa-phone"></i> 51034445</a>
            </div>
        </div>
    </section>

    <!-- Menu Preview Section -->
    <section id="menu" class="menu-section">
        <h2>Our Menu</h2>
        <div class="menu-grid" id="menu-container">
            <!-- Menu items will be injected here via JS once we have the data -->
            <div class="menu-item placeholder">
                <h3>Menu </h3>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer id="contact" class="footer">
        <div class="footer-content">
            <div class="footer-info">
                <h3>Contact Us</h3>
                <p><i class="fas fa-phone"></i> 51034445</p>
                <p><i class="fas fa-map-marker-alt"></i> Sumaismah</p>
            </div>
            <div class="footer-hours">
                <h3>Opening Hours</h3>
                <p>ساعات الشغل</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Al Yzwa Grilling Fish. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
